<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小票账本</title>
<meta name="theme-color" content="#F3ECFA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  :root{
    --bg:#F7F6F2;
    --surface:#FFFFFF;
    --ink:#1C1D1B;
    --muted:#7A7B78;
    --faint:#B0B0AC;
    --line:rgba(28,29,27,.09);
    --brand:#8B7BC7;
    --brand-soft:rgba(139,123,199,.10);
    --danger:#C75146;
    --radius:14px;
    --ease:cubic-bezier(.32,.72,.35,1);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;
    font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--ink);
    background:var(--bg);
  }
  /* 顶部粉紫渐变 + 散落小星星，向下渐隐到暖白 */
  .app::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:
      radial-gradient(circle at 12% 8%, rgba(247,197,204,.55), transparent 34%),
      radial-gradient(circle at 88% 14%, rgba(196,181,229,.5), transparent 38%),
      radial-gradient(circle at 50% 0%, rgba(255,233,168,.35), transparent 30%),
      linear-gradient(to bottom, rgba(243,236,250,.9), rgba(247,246,242,0) 42%);
  }
  .stars{
    position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:
      radial-gradient(circle, rgba(139,123,199,.35) 1px, transparent 1.6px),
      radial-gradient(circle, rgba(232,180,184,.4) 1.2px, transparent 1.8px),
      radial-gradient(circle, rgba(245,216,146,.5) 1px, transparent 1.6px);
    background-size:130px 130px, 190px 190px, 240px 240px;
    background-position:18px 22px, 80px 60px, 140px 10px;
    -webkit-mask-image:linear-gradient(to bottom, black, transparent 46%);
    mask-image:linear-gradient(to bottom, black, transparent 46%);
  }
  .app > *{position:relative;z-index:1}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
  input{font:inherit;color:inherit;border:0;outline:0;background:none}

  .app{
    max-width:560px;margin:0 auto;height:100dvh;
    display:flex;flex-direction:column;
    padding-top:env(safe-area-inset-top);
  }

  /* ---------- 顶部栏 ---------- */
  .topbar{
    flex:none;display:flex;align-items:center;justify-content:space-between;
    padding:18px 22px 6px;
  }
  .month-btn{
    display:flex;align-items:center;gap:4px;
    font-size:22px;font-weight:700;letter-spacing:-.01em;
  }
  .month-btn svg{width:16px;height:16px;color:var(--muted);margin-top:3px}
  .icon-btn{
    width:38px;height:38px;display:grid;place-items:center;
    border-radius:50%;color:var(--ink);
  }
  .icon-btn:active{background:rgba(28,29,27,.06)}
  .icon-btn svg{width:20px;height:20px}

  /* ---------- 搜索条（默认收起） ---------- */
  .searchbar{
    flex:none;display:none;align-items:center;gap:10px;
    margin:6px 22px 0;padding:0 14px;height:44px;
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  }
  .searchbar.open{display:flex}
  .searchbar svg{width:17px;height:17px;color:var(--faint);flex:none}
  .searchbar input{flex:1;min-width:0;font-size:14px}
  .searchbar input::placeholder{color:var(--faint)}
  .searchbar .clear-search{color:var(--muted);font-size:13px;flex:none;padding:4px}

  .filter-hint{
    flex:none;display:none;align-items:center;gap:8px;
    padding:10px 22px 0;font-size:13px;color:var(--muted);
  }
  .filter-hint.show{display:flex}
  .filter-tag{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--brand-soft);color:var(--brand);
    font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:99px;
  }
  .filter-tag button{display:grid;place-items:center;width:16px;height:16px;font-size:12px;line-height:1}

  /* ---------- 摘要 ---------- */
  .summary{flex:none;padding:20px 22px 6px}
  .summary .k{font-size:13px;color:var(--muted)}
  .summary .v{
    margin-top:6px;font-size:38px;font-weight:700;letter-spacing:-.02em;
    font-variant-numeric:tabular-nums;line-height:1.1;
  }
  .summary .c{margin-top:5px;font-size:13px;color:var(--faint);font-variant-numeric:tabular-nums}

  /* ---------- 流水列表 ---------- */
  .list{
    flex:1;min-height:0;overflow-y:auto;
    padding:14px 0 12px;
    -webkit-overflow-scrolling:touch;
  }
  .list::-webkit-scrollbar{width:0}

  .day-group{margin-bottom:4px}
  .day-head{
    display:flex;align-items:baseline;justify-content:space-between;
    padding:16px 22px 6px;
  }
  .day-head .d{font-size:13px;font-weight:600;color:var(--muted)}
  .day-head .t{font-size:12.5px;color:var(--faint);font-variant-numeric:tabular-nums}

  .row{
    display:flex;align-items:center;gap:12px;
    width:100%;min-height:58px;padding:6px 22px;
    text-align:left;
  }
  .row:active{background:rgba(28,29,27,.04)}
  .row + .row{border-top:1px solid var(--line)}
  .row .main{flex:1;min-width:0}
  .row .name{
    font-size:15px;font-weight:500;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .row .cat{
    display:inline-block;margin-top:3px;
    font-size:12px;color:var(--muted);
    padding:1px 8px;border-radius:99px;background:rgba(28,29,27,.05);
  }
  .row .cat.low{outline:1px dashed var(--faint);background:transparent}
  .row .amt{
    flex:none;font-size:15px;font-weight:600;
    font-variant-numeric:tabular-nums;text-align:right;
  }

  /* 空状态 */
  .empty{
    display:none;flex-direction:column;align-items:center;gap:8px;
    padding:90px 40px;text-align:center;
  }
  .empty.show{display:flex}
  .empty .e1{font-size:15px;font-weight:500;color:var(--ink)}
  .empty .e2{font-size:13px;color:var(--muted);line-height:1.7}

  /* ---------- 底部输入 ---------- */
  .composer-wrap{
    flex:none;padding:10px 16px calc(12px + env(safe-area-inset-bottom));
    background:linear-gradient(to top, var(--bg) 78%, transparent);
  }
  .composer{
    display:flex;align-items:flex-end;gap:8px;
    min-height:54px;padding:7px 6px 7px 18px;
    background:var(--surface);
    border:1px solid var(--line);border-radius:27px;
    box-shadow:0 2px 10px rgba(28,29,27,.05);
  }
  .composer textarea{
    flex:1;min-width:0;font-size:15px;font-family:inherit;color:inherit;
    border:0;outline:0;background:none;resize:none;
    line-height:22px;padding:9px 0;margin:0;
    max-height:132px;overflow-y:auto;display:block;
  }
  .composer textarea::placeholder{color:var(--faint)}
  .send{
    flex:none;height:42px;padding:0 18px;border-radius:21px;
    background:var(--brand);color:#fff;
    font-size:14px;font-weight:600;letter-spacing:.01em;
    display:flex;align-items:center;gap:4px;
    transition:opacity .16s var(--ease), transform .16s var(--ease);
  }
  .send:active{transform:scale(.96)}
  .send svg{width:14px;height:14px}

  /* ---------- 编辑弹层 ---------- */
  .sheet-wrap{
    position:fixed;inset:0;z-index:50;
    background:rgba(28,29,27,.35);
    opacity:0;pointer-events:none;transition:opacity .18s var(--ease);
  }
  .sheet-wrap.show{opacity:1;pointer-events:auto}
  .sheet{
    position:absolute;left:0;right:0;bottom:0;
    max-width:560px;margin:0 auto;
    background:var(--surface);
    border-radius:20px 20px 0 0;
    padding:14px 22px calc(20px + env(safe-area-inset-bottom));
    transform:translateY(100%);transition:transform .22s var(--ease);
  }
  .sheet-wrap.show .sheet{transform:none}
  .sheet .grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
  .sheet h2{margin:0 0 14px;font-size:16px;font-weight:600}

  .sheet .field{margin-bottom:12px}
  .sheet label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
  .sheet input[type=text],.sheet input[type=number],.sheet input[type=date]{
    width:100%;height:46px;padding:0 14px;
    background:var(--bg);border-radius:10px;
    font-size:15px;
  }
  .sheet input[type=number]{font-variant-numeric:tabular-nums}

  .cats{display:flex;flex-wrap:wrap;gap:8px}
  .cat-chip{
    height:34px;padding:0 14px;border-radius:99px;
    background:var(--bg);font-size:13.5px;color:var(--ink);
    transition:background .16s var(--ease);
  }
  .cat-chip.on{background:var(--brand);color:#fff;font-weight:600}

  .sheet-actions{display:flex;gap:10px;margin-top:18px}
  .btn{
    height:50px;border-radius:12px;font-size:15px;font-weight:600;
    display:flex;align-items:center;justify-content:center;
    transition:transform .16s var(--ease);
  }
  .btn:active{transform:scale(.97)}
  .btn-primary{flex:1;background:var(--brand);color:#fff}
  .btn-danger{width:110px;background:rgba(199,81,70,.1);color:var(--danger)}

  /* ---------- toast ---------- */
  .toast{
    position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));
    transform:translate(-50%,10px);
    display:flex;align-items:center;gap:14px;
    background:var(--ink);color:#fff;
    font-size:13.5px;padding:11px 8px 11px 18px;border-radius:99px;
    opacity:0;pointer-events:none;transition:all .2s var(--ease);
    white-space:nowrap;max-width:calc(100vw - 40px);
    z-index:60;box-shadow:0 4px 16px rgba(28,29,27,.18);
  }
  .toast.show{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
  .toast-act{
    color:#fff;font-weight:600;font-size:13.5px;
    padding:5px 14px;border-radius:99px;background:rgba(255,255,255,.16);
  }

  /* ---------- 设置弹层 ---------- */
  .settings .danger-row{
    width:100%;display:flex;align-items:center;justify-content:space-between;
    padding:16px 2px;font-size:15px;color:var(--danger);
  }
  .settings .note{font-size:12.5px;color:var(--muted);line-height:1.7;margin:4px 0 0}

  @media (min-width:600px){
    body{padding:0}
  }
</style>
</head>
<body>
<div class="stars" aria-hidden="true"></div>
<div class="app">

  <!-- 顶部栏 -->
  <header class="topbar">
    <button class="month-btn" id="monthBtn" type="button">
      <span id="monthLabel">—</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <div style="display:flex;gap:2px">
      <button class="icon-btn" id="searchBtn" type="button" aria-label="搜索">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      </button>
      <button class="icon-btn" id="settingsBtn" type="button" aria-label="设置">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </header>

  <!-- 月份切换面板（默认收起） -->
  <div class="searchbar" id="monthBar" style="justify-content:space-between">
    <button class="icon-btn" id="prevMonth" type="button" aria-label="上个月">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <span id="monthBarLabel" style="font-size:14px;font-weight:600">—</span>
    <button class="icon-btn" id="nextMonth" type="button" aria-label="下个月">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg>
    </button>
  </div>

  <!-- 搜索框（默认收起） -->
  <div class="searchbar" id="searchBar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <input id="searchInput" type="text" placeholder="搜索名称、分类或金额">
    <button class="clear-search" id="clearSearch" type="button">清除</button>
  </div>

  <div class="filter-hint" id="filterHint">
    <span class="filter-tag"><span id="filterTagText"></span><button id="clearFilter" type="button" aria-label="清除筛选">×</button></span>
    <span id="filterCount"></span>
  </div>

  <!-- 摘要 -->
  <section class="summary">
    <div class="k">本月支出</div>
    <div class="v" id="sumTotal">¥0.00</div>
    <div class="c" id="sumCount">共 0 笔</div>
  </section>

  <!-- 流水列表 -->
  <main class="list" id="list">
    <div id="groups"></div>
    <div class="empty" id="empty">
      <p class="e1" id="emptyTitle">还没有记录</p>
      <p class="e2" id="emptyDesc">在下方输入一句话，记下第一笔消费<br>比如「午饭 35」或「打车 26.5」</p>
    </div>
  </main>

  <!-- 底部输入 -->
  <div class="composer-wrap">
    <div class="composer">
      <textarea id="nl" rows="1" autocomplete="off" enterkeyhint="done" placeholder="午饭35，打车26.5……"></textarea>
      <button class="send" id="sendBtn" type="button">
        记下
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>
      </button>
    </div>
  </div>

  <!-- 编辑弹层 -->
  <div class="sheet-wrap" id="sheetWrap">
    <div class="sheet" role="dialog" aria-modal="true" aria-label="修改这一笔">
      <div class="grab"></div>
      <h2>修改这一笔</h2>
      <div class="field">
        <label for="sheetName">名称</label>
        <input id="sheetName" type="text">
      </div>
      <div class="field">
        <label>分类</label>
        <div class="cats" id="sheetCats"></div>
      </div>
      <div style="display:flex;gap:12px">
        <div class="field" style="flex:1">
          <label for="sheetAmt">金额</label>
          <input id="sheetAmt" type="number" inputmode="decimal" step="0.01" min="0">
        </div>
        <div class="field" style="flex:1">
          <label for="sheetDate">日期</label>
          <input id="sheetDate" type="date">
        </div>
      </div>
      <div class="sheet-actions">
        <button class="btn btn-danger" id="sheetDel" type="button">删除</button>
        <button class="btn btn-primary" id="sheetDone" type="button">完成</button>
      </div>
    </div>
  </div>

  <!-- 设置弹层 -->
  <div class="sheet-wrap" id="settingsWrap">
    <div class="sheet settings" role="dialog" aria-modal="true" aria-label="设置">
      <div class="grab"></div>
      <h2>设置</h2>
      <div class="field">
        <label for="budgetInput">每月预算（元）</label>
        <input id="budgetInput" type="number" inputmode="decimal" min="0" step="100">
      </div>
      <button class="danger-row" id="clearAll" type="button">
        <span>清除本机全部数据</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg>
      </button>
      <p class="note">所有数据只存储在这台设备的浏览器里，不会上传到任何地方。清除后无法恢复。</p>
      <div class="sheet-actions">
        <button class="btn btn-primary" id="settingsDone" type="button" style="flex:1">完成</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">
    <span id="toastMsg"></span>
    <button class="toast-act" id="toastAct" type="button" hidden>撤销</button>
  </div>
</div>

<script src="parser.js"></script>
<script>
(function(){
  "use strict";
  var Parser = window.TicketParser;
  var CAT_LABEL = Parser.CAT_LABEL;
  var CAT_ORDER = ["food","transport","home","shop","other"];

  /* ---------- 状态 ---------- */
  var KEY = "ticket.v1";
  function p2(n){ return (n<10?"0":"")+n; }
  function todayStr(){ var d = new Date(); return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate()); }
  function defaults(){ return { v:1, records:[], draft:[], batchDate: todayStr(), budget:3000 }; }
  var state = (function(){
    try{
      var raw = localStorage.getItem(KEY);
      if(raw){
        var s = JSON.parse(raw);
        if(s && s.v === 1){
          var base = Object.assign(defaults(), s);
          /* 清洗畸形记录：缺字段的记录补默认值，避免渲染崩溃 */
          base.records = (base.records || []).map(function(r){
            if(!r || typeof r !== "object") return null;
            return {
              id: r.id || uid(),
              name: r.name == null ? "" : String(r.name),
              cat: CAT_LABEL[r.cat] ? r.cat : "other",
              amt: isFinite(+r.amt) ? +r.amt : 0,
              date: /^\d{4}-\d{2}-\d{2}$/.test(r.date) ? r.date : todayStr()
            };
          }).filter(Boolean);
          return base;
        }
      }
    }catch(e){}
    return defaults();
  })();
  function persist(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function money(n){ n = +n; if(!isFinite(n)) n = 0; return n.toLocaleString("zh-CN",{minimumFractionDigits:2,maximumFractionDigits:2}); }

  /* ---------- 视图状态 ---------- */
  var view = { month: null, search: "" };
  (function initMonth(){ var d = new Date(); view.month = d.getFullYear()+"-"+p2(d.getMonth()+1); })();

  /* ---------- toast ---------- */
  var toastEl = document.getElementById("toast");
  var toastMsg = document.getElementById("toastMsg");
  var toastAct = document.getElementById("toastAct");
  var toastTimer = null, toastAction = null;
  function toast(msg, act){
    toastMsg.textContent = msg;
    toastAction = act || null;
    toastAct.hidden = !toastAction;
    toastAct.textContent = act ? act.label : "";
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove("show"); }, 6000);
  }
  toastAct.addEventListener("click", function(){
    var fn = toastAction; toastAction = null;
    toastEl.classList.remove("show");
    if(fn) fn.run();
  });

  /* ---------- 工具 ---------- */
  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  }); }
  function dayLabel(dateStr){
    var t = todayStr();
    if(dateStr === t) return "今天";
    var y = new Date(); y.setDate(y.getDate()-1);
    var ys = y.getFullYear()+"-"+p2(y.getMonth()+1)+"-"+p2(y.getDate());
    if(dateStr === ys) return "昨天";
    return (+dateStr.slice(5,7))+"月"+(+dateStr.slice(8))+"日";
  }
  /* 该条记录是否命中当前搜索词 */
  function matchSearch(r){
    if(!view.search) return true;
    var q = view.search.toLowerCase();
    if(r.name.toLowerCase().indexOf(q) > -1) return true;
    if(CAT_LABEL[r.cat].indexOf(q) > -1) return true;
    var amtStr = String(r.amt);
    var qNum = q.replace(/[¥￥元]/g,"").trim();
    if(qNum && amtStr.indexOf(qNum) > -1) return true;
    if(money(r.amt).indexOf(qNum) > -1 && qNum) return true;
    return false;
  }

  /* ---------- 渲染 ---------- */
  var listEl = document.getElementById("groups");
  var emptyEl = document.getElementById("empty");
  var emptyTitle = document.getElementById("emptyTitle");
  var emptyDesc = document.getElementById("emptyDesc");
  var monthLabel = document.getElementById("monthLabel");
  var monthBarLabel = document.getElementById("monthBarLabel");
  var sumTotal = document.getElementById("sumTotal");
  var sumCount = document.getElementById("sumCount");
  var filterHint = document.getElementById("filterHint");
  var filterTagText = document.getElementById("filterTagText");
  var filterCount = document.getElementById("filterCount");

  function monthLabelText(){
    var y = view.month.slice(0,4), m = +view.month.slice(5,7);
    var nowY = String(new Date().getFullYear());
    return y === nowY ? m+"月" : y+"年"+m+"月";
  }

  function render(){
    monthLabel.textContent = monthLabelText();
    monthBarLabel.textContent = view.month.slice(0,4)+" 年 "+(+view.month.slice(5,7))+" 月";

    var inMonth = state.records.filter(function(r){ return r.date.slice(0,7) === view.month; });
    var visible = inMonth.filter(matchSearch);

    var total = visible.reduce(function(s,r){ return s + r.amt; }, 0);
    sumTotal.textContent = "¥" + money(total);
    sumCount.textContent = "共 " + visible.length + " 笔";

    filterHint.classList.toggle("show", !!view.search);
    if(view.search){
      filterTagText.textContent = "搜索：" + view.search;
      filterCount.textContent = visible.length + " 条结果";
    }

    /* 按日期分组 */
    var groups = [];
    var byDay = {};
    visible.forEach(function(r){
      if(!byDay[r.date]){ byDay[r.date] = { date:r.date, rows:[], total:0 }; groups.push(byDay[r.date]); }
      byDay[r.date].rows.push(r);
      byDay[r.date].total += r.amt;
    });
    groups.sort(function(a,b){ return a.date < b.date ? 1 : -1; });
    groups.forEach(function(g){
      g.rows.sort(function(a,b){ return b.id < a.id ? -1 : 1; });
    });

    var html = "";
    groups.forEach(function(g){
      html += '<div class="day-group">'
            + '<div class="day-head"><span class="d">'+dayLabel(g.date)+'</span>'
            + '<span class="t">¥'+money(g.total)+'</span></div>';
      g.rows.forEach(function(r){
        var low = r.cat === "other" ? " low" : "";
        html += '<button class="row" type="button" data-id="'+r.id+'">'
              + '<span class="main"><div class="name">'+esc(r.name)+'</div>'
              + '<span class="cat'+low+'">'+CAT_LABEL[r.cat]+'</span></span>'
              + '<span class="amt">¥'+money(r.amt)+'</span></button>';
      });
      html += '</div>';
    });
    listEl.innerHTML = html;

    var isEmpty = state.records.length === 0;
    var noResult = !isEmpty && visible.length === 0;
    emptyEl.classList.toggle("show", isEmpty || noResult);
    if(isEmpty){
      emptyTitle.textContent = "还没有记录";
      emptyDesc.innerHTML = "在下方输入一句话，记下第一笔消费<br>比如「午饭 35」或「打车 26.5」";
    }else if(noResult){
      emptyTitle.textContent = "没有找到相关记录";
      emptyDesc.textContent = "换个关键词试试";
    }
    persist();
  }

  /* ---------- 月份切换 ---------- */
  var monthBar = document.getElementById("monthBar");
  document.getElementById("monthBtn").addEventListener("click", function(){
    searchBar.classList.remove("open");
    monthBar.classList.toggle("open");
  });
  function shiftMonth(dir){
    var y = +view.month.slice(0,4), m = +view.month.slice(5,7) + dir;
    if(m < 1){ m = 12; y--; }
    if(m > 12){ m = 1; y++; }
    view.month = y + "-" + p2(m);
    render();
  }
  document.getElementById("prevMonth").addEventListener("click", function(){ shiftMonth(-1); });
  document.getElementById("nextMonth").addEventListener("click", function(){ shiftMonth(1); });

  /* ---------- 搜索 ---------- */
  var searchBar = document.getElementById("searchBar");
  var searchInput = document.getElementById("searchInput");
  document.getElementById("searchBtn").addEventListener("click", function(){
    monthBar.classList.remove("open");
    searchBar.classList.toggle("open");
    if(searchBar.classList.contains("open")) searchInput.focus();
  });
  searchInput.addEventListener("input", function(){
    view.search = searchInput.value.trim();
    render();
  });
  function clearSearch(){
    searchInput.value = "";
    view.search = "";
    render();
  }
  document.getElementById("clearSearch").addEventListener("click", clearSearch);
  document.getElementById("clearFilter").addEventListener("click", clearSearch);

  /* ---------- 记账 ---------- */
  var nl = document.getElementById("nl");
  function commit(){
    var res = Parser.parseAll(nl.value, new Date());
    if(res.issues.length){
      toast("这一句没认出金额：" + res.issues[0].raw.slice(0,12));
    }
    if(!res.entries.length) return;
    var batch = res.entries.map(function(e){
      return { id:uid(), name:e.name, cat:e.cat, amt:e.amt, date:e.date };
    });
    state.records = state.records.concat(batch);
    nl.value = "";
    /* 若记的日期不在当前查看月份，跳过去 */
    var newest = batch[batch.length-1].date.slice(0,7);
    if(newest !== view.month) view.month = newest;
    render();

    var n = batch.length, t = batch.reduce(function(s,r){ return s + r.amt; }, 0);
    toast("已记录 " + n + " 笔 · ¥" + money(t), {
      label:"撤销",
      run:function(){
        var ids = {}; batch.forEach(function(b){ ids[b.id] = 1; });
        state.records = state.records.filter(function(r){ return !ids[r.id]; });
        render();
        toast("已撤销");
      }
    });
    nl.style.height = "auto";
    nl.focus();
  }
  function autoGrow(){
    nl.style.height = "auto";
    nl.style.height = Math.min(nl.scrollHeight, 132) + "px";
  }
  nl.addEventListener("input", autoGrow);
  nl.addEventListener("keydown", function(e){
    if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); commit(); }
  });
  document.getElementById("sendBtn").addEventListener("click", commit);

  /* ---------- 行内编辑 ---------- */
  var sheetWrap = document.getElementById("sheetWrap");
  var sheetCats = document.getElementById("sheetCats");
  var sheetName = document.getElementById("sheetName");
  var sheetAmt = document.getElementById("sheetAmt");
  var sheetDate = document.getElementById("sheetDate");
  var editId = null, editCat = "other";

  listEl.addEventListener("click", function(e){
    var b = e.target.closest("[data-id]");
    if(!b) return;
    openSheet(b.getAttribute("data-id"));
  });
  function findRec(id){
    for(var i=0;i<state.records.length;i++) if(state.records[i].id === id) return state.records[i];
    return null;
  }
  function openSheet(id){
    var r = findRec(id);
    if(!r) return;
    editId = id; editCat = r.cat;
    sheetName.value = r.name;
    sheetAmt.value = r.amt;
    sheetDate.value = r.date;
    renderSheetCats();
    sheetWrap.classList.add("show");
  }
  function renderSheetCats(){
    sheetCats.innerHTML = CAT_ORDER.map(function(c){
      return '<button class="cat-chip'+(c===editCat?" on":"")+'" type="button" data-cat="'+c+'">'+CAT_LABEL[c]+'</button>';
    }).join("");
  }
  sheetCats.addEventListener("click", function(e){
    var b = e.target.closest("[data-cat]");
    if(!b) return;
    editCat = b.getAttribute("data-cat");
    renderSheetCats();
  });
  function closeSheet(){ sheetWrap.classList.remove("show"); editId = null; }
  sheetWrap.addEventListener("click", function(e){ if(e.target === sheetWrap) closeSheet(); });

  document.getElementById("sheetDone").addEventListener("click", function(){
    var r = findRec(editId);
    if(!r){ closeSheet(); return; }
    var a = parseFloat(sheetAmt.value);
    var nm = sheetName.value.trim();
    if(nm) r.name = nm;
    if(isFinite(a) && a > 0) r.amt = Math.round(a*100)/100;
    r.cat = editCat;
    if(sheetDate.value) r.date = sheetDate.value;
    closeSheet();
    render();
  });
  document.getElementById("sheetDel").addEventListener("click", function(){
    var r = findRec(editId);
    closeSheet();
    if(!r) return;
    var backup = Object.assign({}, r);
    state.records = state.records.filter(function(x){ return x.id !== r.id; });
    render();
    toast("已删除「" + backup.name.slice(0,10) + "」", {
      label:"撤销",
      run:function(){
        state.records.push(backup);
        render();
      }
    });
  });

  /* ---------- 设置 ---------- */
  var settingsWrap = document.getElementById("settingsWrap");
  var budgetInput = document.getElementById("budgetInput");
  document.getElementById("settingsBtn").addEventListener("click", function(){
    budgetInput.value = state.budget || "";
    settingsWrap.classList.add("show");
  });
  settingsWrap.addEventListener("click", function(e){ if(e.target === settingsWrap) settingsWrap.classList.remove("show"); });
  document.getElementById("settingsDone").addEventListener("click", function(){
    var b = parseFloat(budgetInput.value);
    if(isFinite(b) && b >= 0) state.budget = b;
    persist();
    settingsWrap.classList.remove("show");
  });
  document.getElementById("clearAll").addEventListener("click", function(){
    if(!confirm("确定清除本机全部数据？此操作无法恢复。")) return;
    if(!confirm("再确认一次：所有流水记录都会被删除。")) return;
    var budget = state.budget;
    state = Object.assign(defaults(), { budget: budget });
    persist();
    settingsWrap.classList.remove("show");
    view.month = (function(){ var d=new Date(); return d.getFullYear()+"-"+p2(d.getMonth()+1); })();
    view.search = ""; searchInput.value = "";
    render();
    toast("已清除全部数据");
  });

  /* ---------- 启动 ---------- */
  render();
  if("serviceWorker" in navigator){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  }
})();
</script>
</body>
</html>
